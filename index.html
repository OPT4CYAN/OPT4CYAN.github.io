<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Doñana Biological Area — Notice</title>
<style>
:root{
--red:#c62828; /* deep red for text */
--bg:#ffecec; /* soft red background */
--maxw:900px;
}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box;background:linear-gradient(180deg,#fff 0%, #fafafa 100%);}
.notice{
background:var(--bg);
border:3px solid rgba(198,40,40,0.15);
box-shadow:0 8px 30px rgba(0,0,0,0.06);
padding:28px 32px;
border-radius:12px;
max-width:var(--maxw);
width:100%;
box-sizing:border-box;
}
.label{
font-weight:700;
color:var(--red);
font-size:48px;
margin:0 0 12px 0;
line-height:1.02;
}
.message{
font-size:18px;
color:#222;
margin:0 0 18px 0;
white-space:pre-wrap;
}
.hint{
display:flex;gap:12px;align-items:center;flex-wrap:wrap;
}
.link-placeholder{
display:inline-block;padding:10px 14px;border-radius:8px;border:1px solid rgba(0,0,0,0.06);background:#fff;text-decoration:none;color:var(--red);font-weight:600;
}
@media (max-width:540px){
.label{font-size:34px}
.message{font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">
<main class="notice" role="status" aria-live="polite">
<h1 class="label">Attention,</h1>
<p class="message">This page is outdated. We are working on developing a much more sophisticated page within the Doñana Biological Area's web platform. The link will be added here as soon as it is ready.</p>
<div class="hint">
<!-- Replace the href below with the final link when available -->
<a class="link-placeholder" href="#" id="final-link">Final page link (will appear here)</a>
</div>
</main>
</div>
</body>
</html>
